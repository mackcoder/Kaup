name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - run: mvn -B verify

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke-test:
    name: Subir backend + banco e testar
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Subir Postgres e backend
        run: docker compose up -d --build postgres backend

      - name: Esperar o backend responder
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/analise/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Backend nao respondeu a tempo"
          docker compose logs backend --tail 100
          exit 1

      - name: Conferir que a tabela analise foi criada
        run: docker compose exec -T postgres psql -U usuario_app -d gestao_contratos -c "\dt" | grep analise

      - name: Texto vazio deve retornar 400
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/analise/texto \
            -H "Content-Type: application/json" -d '{"texto":""}')
          echo "HTTP $code"
          test "$code" = "400"

      - name: OCR local deve ler uma imagem
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw, ImageFont
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 34)
          img = Image.new("RGB", (1400, 300), "white")
          d = ImageDraw.Draw(img)
          d.text((40, 40), "CONTRATO DE LOCACAO RESIDENCIAL", font=font, fill="black")
          d.text((40, 120), "O locatario pagara R$ 1.500,00 por mes, ate o dia 5.", font=font, fill="black")
          img.save("contrato.png")
          EOF
          # Sem chave do Gemini, a resposta esperada e 502 "IA (Gemini)":
          # isso prova que o OCR local passou e so a etapa da IA falhou.
          curl -s -X POST http://localhost:8080/api/analise/contrato -F "arquivo=@contrato.png;type=image/png" | tee resposta.json
          echo
          grep -q "Gemini" resposta.json

      - name: Logs do backend (se algo falhou)
        if: failure()
        run: docker compose logs --tail 150

      - name: Derrubar containers
        if: always()
        run: docker compose down -v  
