spring.application.name=kaup-backend
server.port=8080

# Conexão com o PostgreSQL no Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/gestao_contratos
spring.datasource.username=usuario_app
spring.datasource.password=senha_segura
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave do Gemini
gemini.api.key=${GEMINI_API_KEY:}

# OCR - ExtractMyText
extract.api.url=https://generativelanguage.googleapis.com/v1beta
extract.api.key=${EXTRACT_API_KEY:}

spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 10MB
