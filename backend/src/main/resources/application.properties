spring.application.name=kaup-backend
server.port=8080

# Conexão com o PostgreSQL no Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/gestao_contratos
spring.datasource.username=usuario_app
spring.datasource.password=senha_segura
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Não segura a conexão do banco durante a requisição inteira (OCR e IA levam segundos)
spring.jpa.open-in-view=false

# Chave do Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.api.read-timeout-ms=45000

# Provedor de IA em uso (gemini). Para trocar, crie outra implementação de ServicoDeIA.
ia.provedor=gemini

# OCR local (Tesseract via Tess4J)
ocr.tessdata-path=${OCR_TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
ocr.language=por
ocr.max-paginas=20

# Sessão: cookie que o JavaScript não lê, guardado no Postgres (tabelas criadas na subida)
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Conta de administrador, criada na subida se ainda não existir. Vê todos os documentos.
# Os valores padrão (ADMIN@ADMIN / ADMIN) servem só para desenvolvimento: defina
# KAUP_ADMIN_EMAIL e KAUP_ADMIN_PASSWORD antes de publicar, ou KAUP_ADMIN_ENABLED=false.
kaup.admin.enabled=${KAUP_ADMIN_ENABLED:true}
kaup.admin.email=${KAUP_ADMIN_EMAIL:ADMIN@ADMIN}
kaup.admin.password=${KAUP_ADMIN_PASSWORD:ADMIN}
kaup.admin.nome=Administrador

# Recuperação de senha SIMULADA: ainda não há envio de e-mail, então o "código enviado" é sempre este.
# Só para desenvolvimento. Vazio desliga a recuperação (ver RecuperacaoDeSenhaService).
kaup.recuperacao.codigo=${KAUP_CODIGO_FAKE:676869}

spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 10MB
