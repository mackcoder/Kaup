spring.application.name=kaup-backend
server.port=8080

# Conexão com o PostgreSQL no Docker. A senha não fica no repositório: o compose a passa por
# SPRING_DATASOURCE_PASSWORD (vinda do .env), assim como a URL e o usuário.
spring.datasource.url=jdbc:postgresql://postgres:5432/gestao_contratos
spring.datasource.username=usuario_app
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# Não imprime o SQL: os parâmetros das consultas podem carregar texto de contratos.
spring.jpa.show-sql=false
# Não segura a conexão do banco durante a requisição inteira (OCR e IA levam segundos)
spring.jpa.open-in-view=false

# Chave do Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.api.read-timeout-ms=45000

# Provedor de IA em uso (gemini). Para trocar, crie outra implementação de ServicoDeIA.
ia.provedor=gemini

# OCR local (Tesseract via Tess4J)
ocr.tessdata-path=${OCR_TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
ocr.language=por
ocr.max-paginas=20
# Teto de largura x altura de uma imagem (ou de uma página de PDF a 300 dpi): 25 megapixels.
ocr.max-pixels=25000000

# Sessão: cookie que o JavaScript não lê, guardado no Postgres (tabelas criadas na subida)
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Conta de administrador, criada na subida se ainda não existir. Vê todos os documentos.
# Os valores padrão (ADMIN@ADMIN / ADMIN) servem só para desenvolvimento: defina
# KAUP_ADMIN_EMAIL e KAUP_ADMIN_PASSWORD antes de publicar, ou KAUP_ADMIN_ENABLED=false.
kaup.admin.enabled=${KAUP_ADMIN_ENABLED:true}
kaup.admin.email=${KAUP_ADMIN_EMAIL:ADMIN@ADMIN}
kaup.admin.password=${KAUP_ADMIN_PASSWORD:ADMIN}
kaup.admin.nome=Administrador

# Recuperação de senha SIMULADA: ainda não há envio de e-mail, então o "código enviado" é sempre este.
# Só para desenvolvimento. Vazio desliga a recuperação (ver RecuperacaoDeSenhaService).
kaup.recuperacao.codigo=${KAUP_CODIGO_FAKE:676869}

# Retenção: documentos (e conversas) de usuários com mais de N dias são apagados todo dia às 03:30.
# 0 desliga. A conta em si não expira.
kaup.retencao.dias=${KAUP_RETENCAO_DIAS:180}
kaup.retencao.cron=${KAUP_RETENCAO_CRON:0 30 3 * * *}

# Teto GLOBAL por dia de chamadas ao Gemini (contratos analisados + perguntas, de todo mundo), contado no
# banco. Protege a cota da chave. Ao estourar, a API responde 429 até a meia-noite (no fuso abaixo).
# 0 desliga.
kaup.teto-diario-gemini=${KAUP_TETO_DIARIO_GEMINI:500}
kaup.fuso=America/Sao_Paulo

# Limite de requisições por IP (0 desliga cada um). Os padrões protegem a demonstração de um laço de curl;
# atrás de um proxy, "saltos-de-proxy" diz quantos proxies confiáveis acrescentam o IP em X-Forwarded-For
# (0 ignora o cabeçalho e usa o IP da conexão). Ver LimitePorIpFilter.
kaup.limite.ip-por-minuto=${KAUP_LIMITE_IP_POR_MINUTO:60}
kaup.limite.auth-por-minuto=${KAUP_LIMITE_AUTH_POR_MINUTO:10}
kaup.limite.cadastros-por-hora=${KAUP_LIMITE_CADASTROS_POR_HORA:5}
kaup.limite.saltos-de-proxy=${KAUP_SALTOS_DE_PROXY:1}

spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 10MB

# Leitura dos contratos em segundo plano: threads simultâneas e quantos envios podem esperar na fila.
# Fila cheia = o envio recebe 429. O OCR é um só (synchronized), então mais threads ajudam pouco.
kaup.analise.threads=${KAUP_ANALISE_THREADS:2}
kaup.analise.fila=${KAUP_ANALISE_FILA:20}
