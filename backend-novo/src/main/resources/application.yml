spring:
  application:
    name: kaup-backend-novo
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:11MB}
server:
  forward-headers-strategy: none
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: KAUPSESSION
        http-only: true
        same-site: lax
        secure: true
  tomcat:
    max-swallow-size: ${MAX_REQUEST_SIZE:11MB}
    accesslog:
      enabled: false
logging:
  level:
    # Parser diagnostics at INFO/DEBUG include raw request targets and headers.
    org.apache.coyote.http11.Http11Processor: ERROR
auth:
  bcrypt-strength: ${AUTH_BCRYPT_STRENGTH:12}
  max-attempts: ${AUTH_MAX_ATTEMPTS:20}
  attempt-window: ${AUTH_ATTEMPT_WINDOW:PT1M}
