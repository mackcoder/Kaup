services:
  postgres:
    image: postgres:15-alpine
    container_name: app_postgres
    restart: always
    environment:
      POSTGRES_USER: usuario_app
      # Sem valor aqui de propósito: a senha vem do .env (gere com: openssl rand -base64 24).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: gestao_contratos
    # Sem "ports": o banco só é acessível pelo backend, pela rede interna do Docker.
    # Para abrir no seu PC: "127.0.0.1:5432:5432". O Docker ignora o UFW nas portas publicadas.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: app_backend
    restart: always
    ports:
      # Só a própria máquina alcança a API (o proxy do Vite usa localhost:8080).
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/gestao_contratos
      - SPRING_DATASOURCE_USERNAME=usuario_app
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Conta de administrador (vê todos os documentos). Os padrões servem só para desenvolvimento:
      # defina KAUP_ADMIN_PASSWORD no .env antes de publicar, ou KAUP_ADMIN_ENABLED=false.
      - KAUP_ADMIN_ENABLED=${KAUP_ADMIN_ENABLED:-true}
      - KAUP_ADMIN_EMAIL=${KAUP_ADMIN_EMAIL:-ADMIN@ADMIN}
      - KAUP_ADMIN_PASSWORD=${KAUP_ADMIN_PASSWORD:-ADMIN}
      # Recuperação de senha SIMULADA (sem e-mail): o "código enviado" é sempre este. Só para desenvolvimento;
      # vazio desliga a recuperação.
      - KAUP_CODIGO_FAKE=${KAUP_CODIGO_FAKE-676869}
      # Dias até os documentos (e conversas) dos usuários serem apagados. 0 desliga.
      - KAUP_RETENCAO_DIAS=${KAUP_RETENCAO_DIAS:-180}
    depends_on:
      - postgres

volumes:
  postgres_data:
